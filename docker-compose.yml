# Bots Discord na VPS. Fica SEPARADO do compose da Libby: subir/derrubar um bot
# nunca mexe na Libby, e vice-versa.
#
#   docker compose up -d --build        # sobe/atualiza todos
#   docker compose logs -f bot_rebecca  # acompanha um bot
#   docker compose restart bot_bip      # reinicia um bot
#
# Cada bot guarda estado e logs em ./_vps/<bot>/ (gitignored). E pasta comum no
# host de proposito: da para ver/colar arquivos pelo Web console sem docker cp.

x-bot: &bot
  build: .
  image: disbot_canella:latest
  restart: unless-stopped
  # A VPS tem 3,8 GB e ja usa swap; um bot com vazamento de memoria nao pode
  # levar a Libby junto. Um bot discord.py ocioso fica em ~60-80 MB.
  mem_limit: 256m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    BOT_DATA_DIR: /var/lib/bot/dados
    BOT_LOG_DIR: /var/lib/bot/logs

services:
  bot_bip:
    <<: *bot
    container_name: disbot_bip
    working_dir: /app/Bot_Bip
    command: ["python", "bip_bot.py"]
    env_file: Bot_Bip/.env
    volumes:
      - ./_vps/bip:/var/lib/bot

  bot_rebecca:
    <<: *bot
    container_name: disbot_rebecca
    working_dir: /app/Bot_Rebecca
    command: ["python", "rebecca_bot.py"]
    env_file: Bot_Rebecca/.env
    volumes:
      - ./_vps/rebecca:/var/lib/bot

  bot_gerson:
    <<: *bot
    container_name: disbot_gerson
    working_dir: /app/Bot_Gerson
    command: ["python", "gerson_bot.py"]
    # Sem env_file: o Gerson le sozinho o config/.env (montado abaixo). O que esta
    # aqui VENCE o .env (load_dotenv nao sobrescreve variavel ja definida).
    environment:
      # Nao faz login no Onvio: usa o token que a Libby renova (mesma conta).
      GESTTA_TOKEN_ORIGEM: libby
      GESTTA_TOKEN_FILE: /var/lib/libby-tokens/messenger_token.txt
      # Conferir o token de hora em hora custa so ler um arquivo; avisa cedo se
      # a renovacao da Libby parar.
      GESTTA_TOKEN_INTERVALO_H: "1"
      # Copias de estado_empresas.json em backups/ (na VM nunca eram apagadas).
      GERSON_MAX_BACKUPS: "500"
    # O Gerson usa as pastas config/ data/ logs/ backups/ ao lado do codigo.
    # Cada uma vira um bind mount -- nenhuma tem codigo, so dado.
    volumes:
      - ./_vps/gerson/config:/app/Bot_Gerson/config
      - ./_vps/gerson/data:/app/Bot_Gerson/data
      - ./_vps/gerson/logs:/app/Bot_Gerson/logs
      - ./_vps/gerson/backups:/app/Bot_Gerson/backups
      - libby_tokens:/var/lib/libby-tokens:ro

volumes:
  # Criado pelo compose da Libby (canella_libby/docker-compose.prod.yml). Se a
  # Libby ainda nao foi deployada com ele, o `up` falha com "external volume not
  # found" -- de proposito: sem esse volume o Gerson nao teria token.
  libby_tokens:
    external: true
    name: libby_gestta_tokens
